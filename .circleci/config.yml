version: 2.1

jobs:
  deploy:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - run:
          name: Install Foundry
          command: |
            curl -L https://foundry.paradigm.xyz | bash
            foundryup
      - run:
          name: Deploy Smart Contract
          command: |
            forge create --rpc-url $ETH_RPC_URL --private-key $PRIVATE_KEY path/to/YourContract.sol:YourContract
      - run:
          name: Verify on Etherscan
          command: |
            forge verify-contract --chain-id 1 --etherscan-api-key $ETHERSCAN_API_KEY path/to/YourContract.sol:YourContract

workflows:
  version: 2
  deploy:
    jobs:
      - deploy
